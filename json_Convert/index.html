<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Notes JSON 轉換器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Side: Input -->
        <div class="w-full md:w-1/2 p-6 border-r border-slate-100">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-slate-800 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    貼上更新日誌內容
                </h2>
            </div>
            <textarea 
                id="inputText" 
                class="w-full h-96 p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm leading-relaxed custom-scrollbar"
                placeholder="在此貼上文字...&#10;例如：&#10;NEW&#10;* 載入進度顯示..."
            ></textarea>
        </div>

        <!-- Right Side: Output -->
        <div class="w-full md:w-1/2 p-6 bg-slate-900 text-slate-300">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-white flex items-center">
                    <svg class="w-5 h-5 mr-2 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                    JSON 字串內容
                </h2>
                <button 
                    onclick="copyToClipboard()" 
                    id="copyBtn"
                    class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition-colors flex items-center"
                >
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    複製
                </button>
            </div>
            <div class="relative group">
                <pre id="outputText" class="w-full h-96 p-4 bg-black/30 rounded-xl overflow-auto text-sm font-mono text-green-400 leading-relaxed custom-scrollbar whitespace-pre-wrap break-all border border-slate-700"></pre>
                <div id="statusMsg" class="absolute bottom-4 right-4 px-3 py-1 bg-green-500 text-white text-xs rounded shadow-lg transform translate-y-10 opacity-0 transition-all duration-300">
                    已複製！
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Information -->
    <div class="mt-6 text-slate-400 text-sm flex items-center">
        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
        <span>此工具會自動使用 JSON.stringify 處理換行符號與轉義字元。</span>
    </div>

    <script>
        const inputArea = document.getElementById('inputText');
        const outputArea = document.getElementById('outputText');
        const statusMsg = document.getElementById('statusMsg');

        function convert() {
            const rawText = inputArea.value;
            
            // 直接對字串進行 JSON 字串化，這會自動處理轉義字元並加上前後雙引號
            const jsonStringValue = JSON.stringify(rawText);
            
            outputArea.textContent = jsonStringValue;
        }

        // 監聽輸入事件
        inputArea.addEventListener('input', convert);

        // 複製到剪貼簿功能
        function copyToClipboard() {
            const textToCopy = outputArea.textContent;
            if (!textToCopy) return;

            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                document.execCommand('copy');
                // 顯示成功提示
                statusMsg.classList.remove('translate-y-10', 'opacity-0');
                setTimeout(() => {
                    statusMsg.classList.add('translate-y-10', 'opacity-0');
                }, 2000);
            } catch (err) {
                console.error('無法複製', err);
            }
            
            document.body.removeChild(tempTextArea);
        }

        // 初始化範例 (選用)
        window.onload = () => {
            inputArea.value = `NEW\n* 載入進度顯示 (進度條/經過時間/剩餘時間)\n* 拖入檔案數量提醒\n\nModify\n* 縮圖列改為分頁顯示方式 (50項/頁)\n\nBug\n* 修正 Info 視窗標籤閃爍問題`;
            convert();
        };
    </script>
</body>
</html>
