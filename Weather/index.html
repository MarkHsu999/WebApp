<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>善化動態天氣</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400">善化即時天氣</h1>
            <span id="update-time" class="text-xs text-slate-400">更新中...</span>
        </div>

        <div class="flex items-center justify-between">
            <div>
                <div id="temp" class="text-6xl font-extrabold tracking-tighter">--°C</div>
                <div id="weather" class="text-lg text-slate-300 mt-2">讀取中...</div>
            </div>
            <div id="weather-icon" class="text-6xl">⏳</div>
        </div>
        
        <button onclick="fetchWeather()" class="w-full mt-8 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-medium transition-colors">重新整理</button>
    </div>

    <script>
        const API_KEY = 'YOUR_API_KEY_HERE';
        const STATION_NAME = '善化'; 

        // 邏輯：根據天氣字串回傳 Emoji
        function getWeatherIcon(desc) {
            if (desc.includes('雨')) return '🌧️';
            if (desc.includes('雲')) return '☁️';
            if (desc.includes('陰')) return '🌥️';
            if (desc.includes('雷')) return '⛈️';
            return '☀️'; // 預設太陽
        }

        async function fetchWeather() {
            try {
                const url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0001-001?Authorization=${API_KEY}&StationName=${encodeURIComponent(STATION_NAME)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                const station = data.records.Station[0];
                const obs = station.WeatherElement;
                const weatherDesc = station.Weather || "晴";

                document.getElementById('temp').innerText = `${obs.AirTemperature}°C`;
                document.getElementById('weather').innerText = weatherDesc;
                document.getElementById('weather-icon').innerText = getWeatherIcon(weatherDesc);
                document.getElementById('update-time').innerText = `觀測時間：${station.ObsTime.DateTime.split('T')[1].substring(0, 5)}`;
            } catch (error) {
                document.getElementById('weather').innerText = "讀取失敗，請檢查 Key";
                document.getElementById('weather-icon').innerText = "❌";
            }
        }
        fetchWeather();
    </script>
</body>
</html>
