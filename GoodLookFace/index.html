<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>優熊比例鑑定儀 🐻</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        /* 增加觸控熱區，讓線更好抓 */
        .line-handle {
            transition: background-color 0.2s;
            height: 2px; /* 視覺線條 */
        }
        .line-handle::after {
            content: '';
            position: absolute;
            top: -15px;
            bottom: -15px;
            left: 0;
            right: 0;
            background: transparent;
            cursor: ns-resize;
        }
        .line-handle:hover {
            background-color: rgba(255, 255, 255, 0.8) !important;
        }
        .line-active {
            background-color: #fbbf24 !important;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.9);
            height: 4px;
        }
        /* 禁止在操作區捲動 */
        #image-container, .cropper-container {
            touch-action: none;
        }
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .cropper-view-box, .cropper-face {
            border-radius: 8px;
        }
        /* 讓標籤不會被手指擋住 */
        .line-label {
            transform: translateY(-50%);
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-stone-50 min-h-screen text-stone-800 font-sans overscroll-none">

    <div class="max-w-6xl mx-auto px-4 py-6 md:py-8">
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-black text-stone-900 mb-2">優熊比例鑑定儀 🐻</h1>
            <p class="text-stone-500 italic text-sm md:text-base">你是天菜天選之熊，還是需要靠鬍子補救的熊？</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <!-- 左側：圖片編輯/裁切區 -->
            <div class="lg:col-span-2 space-y-4">
                <div id="drop-zone" class="relative bg-white border-4 border-dashed border-stone-200 rounded-3xl p-3 md:p-4 min-h-[400px] md:min-h-[550px] flex flex-col items-center justify-center overflow-hidden custom-shadow transition-all">
                    
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                    
                    <!-- 1. 上傳導引 -->
                    <div id="upload-prompt" class="text-center p-4">
                        <div class="bg-amber-100 text-amber-700 p-5 rounded-full inline-block mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 md:w-12 md:h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold mb-2">交出你的正臉照</h3>
                        <p class="text-stone-400 text-sm px-4">請撥開瀏海，展示你那寫滿命運的臉龐</p>
                        <button onclick="document.getElementById('file-input').click()" class="mt-6 px-10 py-4 bg-amber-800 text-white font-bold rounded-full hover:bg-amber-900 transition transform active:scale-95 shadow-lg">
                            選擇照片
                        </button>
                    </div>

                    <!-- 2. 裁切區域 -->
                    <div id="crop-workspace" class="hidden w-full h-full flex flex-col items-center">
                        <div class="w-full max-h-[50vh] md:max-h-[60vh] overflow-hidden rounded-xl bg-stone-900">
                            <img id="crop-img" class="max-w-full">
                        </div>
                        <div class="mt-6 flex gap-3 w-full max-w-sm px-4">
                            <button onclick="cancelCrop()" class="flex-1 py-4 bg-stone-200 text-stone-600 font-bold rounded-2xl hover:bg-stone-300 transition active:scale-95">取消</button>
                            <button onclick="confirmCrop()" class="flex-[2] py-4 bg-amber-600 text-white font-bold rounded-2xl hover:bg-amber-700 transition active:scale-95 shadow-md">裁切完成</button>
                        </div>
                    </div>

                    <!-- 3. 鑑定區域 -->
                    <div id="image-workspace" class="hidden relative w-full h-full flex items-center justify-center py-4">
                        <div id="image-container" class="relative inline-block cursor-crosshair">
                            <img id="preview-img" class="max-w-full max-h-[65vh] md:max-h-[75vh] rounded-lg select-none pointer-events-none shadow-xl">
                            
                            <!-- 拖曳線 -->
                            <div id="line-1" class="line-handle absolute left-0 right-0 bg-white/60 z-10 flex items-center justify-end" style="top: 20%;">
                                <span class="line-label bg-black/70 text-white text-[10px] md:text-[11px] px-2 py-1 rounded-l-md font-bold">髮際線</span>
                            </div>
                            <div id="line-2" class="line-handle absolute left-0 right-0 bg-white/60 z-10 flex items-center justify-end" style="top: 40%;">
                                <span class="line-label bg-black/70 text-white text-[10px] md:text-[11px] px-2 py-1 rounded-l-md font-bold">眉心</span>
                            </div>
                            <div id="line-3" class="line-handle absolute left-0 right-0 bg-white/60 z-10 flex items-center justify-end" style="top: 60%;">
                                <span class="line-label bg-black/70 text-white text-[10px] md:text-[11px] px-2 py-1 rounded-l-md font-bold">鼻底</span>
                            </div>
                            <div id="line-4" class="line-handle absolute left-0 right-0 bg-white/60 z-10 flex items-center justify-end" style="top: 80%;">
                                <span class="line-label bg-black/70 text-white text-[10px] md:text-[11px] px-2 py-1 rounded-l-md font-bold">下巴尖</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側：數據統計區 -->
            <div class="bg-white rounded-3xl p-6 md:p-8 custom-shadow border border-stone-100 flex flex-col h-full">
                <h2 class="text-xl md:text-2xl font-bold mb-4 md:mb-6 flex items-center text-stone-900">
                    <span class="mr-2 text-2xl">🔎</span> 優熊屬性鑑定
                </h2>
                
                <div class="mb-6 md:mb-8 text-center p-4 md:p-6 bg-amber-50 rounded-2xl border border-amber-100">
                    <p class="text-[10px] text-amber-600 font-bold tracking-widest uppercase mb-1">您的三庭比例</p>
                    <div id="ratio-summary" class="text-2xl md:text-3xl font-black text-amber-900 tracking-tighter">
                        -- : -- : --
                    </div>
                </div>

                <div class="space-y-6 flex-grow">
                    <div>
                        <div class="flex justify-between items-end mb-1">
                            <span class="text-sm font-bold text-stone-500">上庭 (智慧)</span>
                            <span id="ratio-1-val" class="text-lg font-black text-amber-700">--</span>
                        </div>
                        <div class="w-full bg-stone-100 h-2 rounded-full overflow-hidden">
                            <div id="ratio-1-bar" class="bg-amber-600 h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-end mb-1">
                            <span class="text-sm font-bold text-stone-500">中庭 (英氣)</span>
                            <span id="ratio-2-val" class="text-lg font-black text-stone-700">--</span>
                        </div>
                        <div class="w-full bg-stone-100 h-2 rounded-full overflow-hidden">
                            <div id="ratio-2-bar" class="bg-stone-600 h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-end mb-1">
                            <span class="text-sm font-bold text-stone-500">下庭 (穩重)</span>
                            <span id="ratio-3-val" class="text-lg font-black text-orange-700">--</span>
                        </div>
                        <div class="w-full bg-stone-100 h-2 rounded-full overflow-hidden">
                            <div id="ratio-3-bar" class="bg-orange-600 h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="mt-8 p-4 bg-stone-900 text-stone-100 rounded-2xl shadow-inner">
                    <h3 class="font-bold text-amber-400 mb-1 flex items-center text-sm md:text-base">
                        <span class="mr-2">📢</span> 鑑定結果
                    </h3>
                    <p id="commentary" class="text-xs md:text-sm leading-relaxed text-stone-300 min-h-[3rem]">
                        請上傳照片並裁切臉部，讓本機器人鑑定一下。
                    </p>
                </div>
                
                <div class="mt-6 space-y-3">
                    <button id="download-btn" onclick="saveResult()" class="w-full py-4 bg-amber-800 text-white font-bold rounded-2xl hover:bg-amber-900 transition transform active:scale-95 shadow-lg flex items-center justify-center hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        儲存鑑定圖
                    </button>
                    <button onclick="location.reload()" class="w-full py-3 bg-stone-100 text-stone-500 font-bold rounded-2xl hover:bg-stone-200 transition active:scale-95 text-sm">
                        重測一次
                    </button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="export-canvas" class="hidden"></canvas>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadPrompt = document.getElementById('upload-prompt');
        const cropWorkspace = document.getElementById('crop-workspace');
        const imageWorkspace = document.getElementById('image-workspace');
        const previewImg = document.getElementById('preview-img');
        const cropImg = document.getElementById('crop-img');
        const imageContainer = document.getElementById('image-container');
        const dropZone = document.getElementById('drop-zone');
        const downloadBtn = document.getElementById('download-btn');

        let cropper = null;
        let activeLine = null;
        let containerRect = null;
        let currentRatios = { f1: "--", f2: "--", f3: "--" };

        const lines = [
            document.getElementById('line-1'),
            document.getElementById('line-2'),
            document.getElementById('line-3'),
            document.getElementById('line-4')
        ];

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-amber-50', 'border-amber-300'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('bg-amber-50', 'border-amber-300'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) handleFile(file);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadPrompt.classList.add('hidden');
                cropWorkspace.classList.remove('hidden');
                cropImg.src = e.target.result;
                
                if (cropper) cropper.destroy();
                cropper = new Cropper(cropImg, {
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 0.85,
                    restore: false,
                    guides: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                });
            };
            reader.readAsDataURL(file);
        }

        function cancelCrop() {
            cropWorkspace.classList.add('hidden');
            uploadPrompt.classList.remove('hidden');
            if (cropper) cropper.destroy();
            fileInput.value = '';
        }

        function confirmCrop() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ maxWidth: 1080, maxHeight: 1440 });
            previewImg.src = canvas.toDataURL('image/jpeg', 0.9);
            cropWorkspace.classList.add('hidden');
            imageWorkspace.classList.remove('hidden');
            downloadBtn.classList.remove('hidden');
            
            lines[0].style.top = '15%';
            lines[1].style.top = '35%';
            lines[2].style.top = '60%';
            lines[3].style.top = '85%';
            
            setTimeout(updateCalculations, 150);
            cropper.destroy();
            cropper = null;
        }

        lines.forEach(line => {
            const startDragging = (e) => {
                // 阻止捲動，這在手機上很重要
                if (e.cancelable) e.preventDefault();
                
                activeLine = line;
                line.classList.add('line-active');
                containerRect = imageContainer.getBoundingClientRect();
                
                const onMove = (me) => {
                    const clientY = me.type === 'touchmove' ? me.touches[0].clientY : me.clientY;
                    let relativeY = clientY - containerRect.top;
                    let percentage = (relativeY / containerRect.height) * 100;
                    percentage = Math.max(0, Math.min(100, percentage));
                    activeLine.style.top = percentage + '%';
                    updateCalculations();
                };

                const onUp = () => {
                    if (activeLine) activeLine.classList.remove('line-active');
                    activeLine = null;
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    document.removeEventListener('touchmove', onMove);
                    document.removeEventListener('touchend', onUp);
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onUp);
            };

            line.addEventListener('mousedown', startDragging);
            line.addEventListener('touchstart', startDragging, { passive: false });
        });

        function updateCalculations() {
            const pos = lines.map(l => parseFloat(l.style.top));
            const h1 = pos[1] - pos[0];
            const h2 = pos[2] - pos[1];
            const h3 = pos[3] - pos[2];

            if (h1 > 0 && h2 > 0 && h3 > 0) {
                const r1 = 1;
                const r2 = h2 / h1;
                const r3 = h3 / h1;
                updateUI(r1, r2, r3, h1, h2, h3);
            }
        }

        function updateUI(r1, r2, r3, h1, h2, h3) {
            const f1 = r1.toFixed(2);
            const f2 = r2.toFixed(2);
            const f3 = r3.toFixed(2);
            currentRatios = { f1, f2, f3 };

            document.getElementById('ratio-summary').innerText = `${f1} : ${f2} : ${f3}`;
            document.getElementById('ratio-1-val').innerText = f1;
            document.getElementById('ratio-2-val').innerText = f2;
            document.getElementById('ratio-3-val').innerText = f3;

            const total = h1 + h2 + h3;
            document.getElementById('ratio-1-bar').style.width = (h1/total*100) * 3 + '%';
            document.getElementById('ratio-2-bar').style.width = (h2/total*100) * 3 + '%';
            document.getElementById('ratio-3-bar').style.width = (h3/total*100) * 3 + '%';

            generateCommentary(r2, r3);
        }

        function generateCommentary(r2, r3) {
            const commentEl = document.getElementById('commentary');
            const d2 = Math.abs(r2 - 1);
            const d3 = Math.abs(r3 - 1);
            const totalDiff = d2 + d3;

            if (totalDiff < 0.05) {
                commentEl.innerText = "這比例...你是優熊界的天菜吧？1:1:1 的完美比例，不管是粗曠風還是型男風都能完美駕馭！";
            } else if (r2 > 1.2) {
                commentEl.innerText = "中庭偏長，這可是標準的「熟男熊」比例！看起來英氣逼人，很有成熟可靠的大叔感。";
            } else if (r3 > 1.2) {
                commentEl.innerText = "下庭有力，這是穩重「霸氣熊」的象徵。如果你有留鬍子，那威懾力簡集爆表！";
            } else if (r2 < 0.8) {
                commentEl.innerText = "中庭偏短，是個可愛的「奶熊」呢！這種幼態比例最容易激發別人的保護欲了。";
            } else if (r3 < 0.8) {
                commentEl.innerText = "下巴精緻，屬於「型男熊」路線。記得要把鬍渣修乾淨，走一個俐落帥氣的風格。";
            } else {
                commentEl.innerText = "這比例很標準！很有「鄰家優熊」的親和力，是那種走在路上回頭率會很高的類型喔。";
            }
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(""); 
            let line = "";
            let testLine = "";
            let lineCount = 0;

            for (let n = 0; n < words.length; n++) {
                testLine = line + words[n];
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n];
                    y += lineHeight;
                    lineCount++;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
            return lineCount + 1;
        }

        function saveResult() {
            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d');
            const img = document.getElementById('preview-img');
            const comment = document.getElementById('commentary').innerText;

            const footerHeight = Math.max(220, img.naturalWidth * 0.4);
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight + footerHeight;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = Math.max(2, img.naturalWidth / 180);
            ctx.setLineDash([15, 8]);

            const pos = lines.map(l => parseFloat(l.style.top) / 100 * img.naturalHeight);
            const labels = ["髮際線", "眉心", "鼻底", "下巴尖"];

            pos.forEach((y, i) => {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(img.naturalWidth, y);
                ctx.stroke();

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                let labelFontSize = Math.max(18, img.naturalWidth / 22);
                ctx.font = `bold ${labelFontSize}px Sans-serif`;
                ctx.fillText(labels[i], 15, y - 10);
            });

            const footerY = img.naturalHeight;
            ctx.setLineDash([]); 
            ctx.textAlign = 'center';
            const maxWidth = img.naturalWidth * 0.9;
            
            const mainText = `優熊鑑定比例：${currentRatios.f1} : ${currentRatios.f2} : ${currentRatios.f3}`;
            let mainFontSize = Math.max(28, img.naturalWidth / 12);
            ctx.font = `900 ${mainFontSize}px Sans-serif`;
            while (ctx.measureText(mainText).width > maxWidth && mainFontSize > 14) {
                mainFontSize -= 2;
                ctx.font = `900 ${mainFontSize}px Sans-serif`;
            }
            ctx.fillStyle = '#92400e';
            ctx.fillText(mainText, canvas.width / 2, footerY + (footerHeight * 0.28));
            
            let commentFontSize = Math.max(16, img.naturalWidth / 30);
            ctx.font = `italic ${commentFontSize}px Sans-serif`;
            ctx.fillStyle = '#44403c';
            const lineHeight = commentFontSize * 1.5;
            wrapText(ctx, "結果點評：" + comment, canvas.width / 2, footerY + (footerHeight * 0.48), maxWidth, lineHeight);

            const subText = "優熊鑑定儀 | 天菜還是需要鬍子補救？";
            let subFontSize = Math.max(12, img.naturalWidth / 45);
            ctx.font = `${subFontSize}px Sans-serif`;
            ctx.fillStyle = '#a8a29e';
            ctx.fillText(subText, canvas.width / 2, footerY + (footerHeight * 0.88));

            try {
                const link = document.createElement('a');
                link.download = `bear-analysis-${Date.now()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
